<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Passenger Compass</title>

<style>
  :root {
    --bg-color: #f0edf4;
    --text-color: #333333;
    --shadow-light: #ffffff;
    --shadow-dark: #d5d1dd;
    --accent-green: #a4c639;
    --accent-orange: #f28500;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #1e1e1e;
      --text-color: #a0a0a0;
      --shadow-light: #2c2c2c;
      --shadow-dark: #101010;
    }
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .texture-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
  }

  .app-container {
    width: 350px;
    height: 650px;
    border-radius: 40px;
    padding: 30px 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    box-shadow:
      12px 12px 24px var(--shadow-dark),
      -12px -12px 24px var(--shadow-light);
    position: relative;
  }

  .status-badge {
    font-size: 13px;
    font-weight: bold;
    padding: 8px 16px;
    border-radius: 20px;
    box-shadow:
      inset 3px 3px 6px var(--shadow-dark),
      inset -3px -3px 6px var(--shadow-light);
    opacity: 0.8;
    text-align: center;
  }

  .compass-container {
    position: relative;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow:
      12px 12px 24px var(--shadow-dark),
      -12px -12px 24px var(--shadow-light);
  }

  .compass-inner {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow:
      inset 8px 8px 16px var(--shadow-dark),
      inset -8px -8px 16px var(--shadow-light);
  }

  .direction-arrow-container {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    z-index: 10;
  }

  .direction-arrow {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-bottom: 30px solid var(--accent-green);
    filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.2));
  }

  .distance-label {
    font-size: 16px;
    margin-bottom: 2px;
  }

  .distance-value {
    font-size: 42px;
    font-weight: 600;
    letter-spacing: 1px;
    text-align: center;
  }

  .unit {
    font-size: 18px;
    font-weight: normal;
  }

  .input-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 10px;
  }

  .coord-input {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 15px;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-size: 13px;
    box-sizing: border-box;
    box-shadow:
      inset 4px 4px 8px var(--shadow-dark),
      inset -4px -4px 8px var(--shadow-light);
    outline: none;
  }

  .coord-input::placeholder {
    color: #a0a0a0;
  }

  .btn {
    padding: 15px;
    border: none;
    border-radius: 15px;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow:
      6px 6px 12px var(--shadow-dark),
      -6px -6px 12px var(--shadow-light);
    transition: all 0.1s;
  }

  .btn:active {
    box-shadow:
      inset 4px 4px 8px var(--shadow-dark),
      inset -4px -4px 8px var(--shadow-light);
    color: var(--accent-orange);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .hint {
    font-size: 11px;
    color: #888;
    text-align: center;
    margin-top: -5px;
    line-height: 1.4;
  }
</style>
</head>

<body>

<div class="texture-overlay"></div>

<div class="app-container">

  <div class="status-badge" id="status">
    🧭 待機中
  </div>

  <div class="compass-container">

    <div
      class="direction-arrow-container"
      id="arrowContainer">
      <div class="direction-arrow"></div>
    </div>

    <div class="compass-inner">

      <div class="distance-label">
        残り
      </div>

      <div
        class="distance-value"
        id="distanceDisplay">
        --.<span class="unit">km</span>
      </div>

    </div>

  </div>

  <div class="input-section">

    <input
      type="text"
      id="coordInput"
      class="coord-input"
      placeholder="Googleマップの共有URLをペースト"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false">

    <button
      id="startBtn"
      class="btn">
      ナビ開始
    </button>

    <div
      class="hint"
      id="errorHint"
      style="display:none;">
      ※URLから座標を取得できませんでした。<br>
      Googleマップで場所を長押しして表示される<br>
      「35.xxx, 136.xxx」の数値を直接入力してください。
    </div>

  </div>

</div>


<script>

"use strict";


/* =========================================================
   DOM
========================================================= */

const arrowContainer =
  document.getElementById("arrowContainer");

const distanceDisplay =
  document.getElementById("distanceDisplay");

const statusBadge =
  document.getElementById("status");

const coordInput =
  document.getElementById("coordInput");

const startBtn =
  document.getElementById("startBtn");

const errorHint =
  document.getElementById("errorHint");


/* =========================================================
   State
========================================================= */

let destLat = null;
let destLng = null;

let currentLat = null;
let currentLng = null;

let targetBearing = 0;
let deviceHeading = 0;

let watchId = null;


/* =========================================================
   Distance
========================================================= */

function calculateDistance(lat1, lon1, lat2, lon2) {

  const R = 6371;

  const dLat =
    (lat2 - lat1) * Math.PI / 180;

  const dLon =
    (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  return R *
    (2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    ));
}


/* =========================================================
   Bearing
========================================================= */

function calculateBearing(lat1, lon1, lat2, lon2) {

  const lat1Rad =
    lat1 * Math.PI / 180;

  const lat2Rad =
    lat2 * Math.PI / 180;

  const lonDiff =
    (lon2 - lon1) * Math.PI / 180;

  const y =
    Math.sin(lonDiff) *
    Math.cos(lat2Rad);

  const x =
    Math.cos(lat1Rad) *
    Math.sin(lat2Rad) -

    Math.sin(lat1Rad) *
    Math.cos(lat2Rad) *
    Math.cos(lonDiff);

  return (
    Math.atan2(y, x) *
    180 / Math.PI +
    360
  ) % 360;
}


/* =========================================================
   UI
========================================================= */

function updateUI() {

  if (
    currentLat !== null &&
    currentLng !== null &&
    destLat !== null &&
    destLng !== null
  ) {

    const distKm =
      calculateDistance(
        currentLat,
        currentLng,
        destLat,
        destLng
      );

    distanceDisplay.innerHTML =
      `${distKm.toFixed(1)}<span class="unit">km</span>`;

    targetBearing =
      calculateBearing(
        currentLat,
        currentLng,
        destLat,
        destLng
      );
  }

  arrowContainer.style.transform =
    `rotate(${targetBearing - deviceHeading}deg)`;
}


/* =========================================================
   Orientation
========================================================= */

function handleOrientation(event) {

  if (
    event.webkitCompassHeading !== undefined &&
    event.webkitCompassHeading !== null
  ) {

    deviceHeading =
      event.webkitCompassHeading;

  } else if (
    event.absolute === true &&
    event.alpha !== null
  ) {

    deviceHeading =
      (360 - event.alpha) % 360;
  }

  updateUI();
}


/* =========================================================
   Sensors
========================================================= */

function startSensors() {

  statusBadge.innerText =
    "⚡️ センサー起動中...";

  errorHint.style.display =
    "none";


  window.removeEventListener(
    "deviceorientation",
    handleOrientation,
    true
  );

  window.removeEventListener(
    "deviceorientationabsolute",
    handleOrientation,
    true
  );


  if (
    "ondeviceorientationabsolute" in window
  ) {

    window.addEventListener(
      "deviceorientationabsolute",
      handleOrientation,
      true
    );

  } else {

    window.addEventListener(
      "deviceorientation",
      handleOrientation,
      true
    );
  }


  if (!navigator.geolocation) {

    statusBadge.innerText =
      "⚠️ GPS非対応";

    return;
  }


  if (watchId !== null) {

    navigator.geolocation.clearWatch(
      watchId
    );
  }


  watchId =
    navigator.geolocation.watchPosition(

      (position) => {

        currentLat =
          position.coords.latitude;

        currentLng =
          position.coords.longitude;

        statusBadge.innerText =
          "🛰️ 案内中";

        updateUI();
      },

      (error) => {

        console.error(
          "GPS error:",
          error
        );

        statusBadge.innerText =
          "⚠️ GPSエラー";
      },

      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 10000
      }
    );
}


/* =========================================================
   Timeout付きfetch
========================================================= */

async function fetchWithTimeout(
  url,
  timeoutMs = 8000
) {

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeoutMs
    );

  try {

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,
          redirect: "follow"
        }
      );

    return response;

  } finally {

    clearTimeout(timer);
  }
}


/* =========================================================
   座標の妥当性確認
========================================================= */

function validCoordinate(lat, lng) {

  return (
    Number.isFinite(lat) &&
    Number.isFinite(lng) &&
    lat >= -90 &&
    lat <= 90 &&
    lng >= -180 &&
    lng <= 180
  );
}


/* =========================================================
   Google Maps URL内から座標を探す
========================================================= */

function extractCoordinates(text) {

  if (!text) {
    return null;
  }


  /*
   * @35.123456,136.123456
   */

  let match =
    text.match(
      /@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/i
    );

  if (match) {

    const lat =
      parseFloat(match[1]);

    const lng =
      parseFloat(match[2]);

    if (
      validCoordinate(lat, lng)
    ) {

      return {
        lat: lat,
        lng: lng,
        source: "@"
      };
    }
  }


  /*
   * !3d35.123456!4d136.123456
   */

  match =
    text.match(
      /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/i
    );

  if (match) {

    const lat =
      parseFloat(match[1]);

    const lng =
      parseFloat(match[2]);

    if (
      validCoordinate(lat, lng)
    ) {

      return {
        lat: lat,
        lng: lng,
        source: "!3d!4d"
      };
    }
  }


  /*
   * destination=35.123456,136.123456
   */

  match =
    text.match(
      /destination=(-?\d+(?:\.\d+)?)[,%](-?\d+(?:\.\d+)?)/i
    );

  if (match) {

    const lat =
      parseFloat(match[1]);

    const lng =
      parseFloat(match[2]);

    if (
      validCoordinate(lat, lng)
    ) {

      return {
        lat: lat,
        lng: lng,
        source: "destination"
      };
    }
  }


  /*
   * center=35.123456,136.123456
   */

  match =
    text.match(
      /center=(-?\d+(?:\.\d+)?)[,%](-?\d+(?:\.\d+)?)/i
    );

  if (match) {

    const lat =
      parseFloat(match[1]);

    const lng =
      parseFloat(match[2]);

    if (
      validCoordinate(lat, lng)
    ) {

      return {
        lat: lat,
        lng: lng,
        source: "center"
      };
    }
  }


  /*
   * q=35.123456,136.123456
   */

  match =
    text.match(
      /[?&]q=(-?\d+(?:\.\d+)?)[,%](-?\d+(?:\.\d+)?)/i
    );

  if (match) {

    const lat =
      parseFloat(match[1]);

    const lng =
      parseFloat(match[2]);

    if (
      validCoordinate(lat, lng)
    ) {

      return {
        lat: lat,
        lng: lng,
        source: "q"
      };
    }
  }


  return null;
}


/* =========================================================
   直接入力された座標
========================================================= */

function extractDirectCoordinates(input) {

  const match =
    input.match(
      /(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/
    );

  if (!match) {
    return null;
  }


  const lat =
    parseFloat(match[1]);

  const lng =
    parseFloat(match[2]);


  if (
    !validCoordinate(lat, lng)
  ) {

    return null;
  }


  return {
    lat: lat,
    lng: lng,
    source: "direct"
  };
}


/* =========================================================
   入力文字列からURLを取り出す
========================================================= */

function extractURL(input) {

  const trimmed =
    input.trim();


  /*
   * URLだけの場合
   */

  try {

    if (
      /^https?:\/\//i.test(trimmed)
    ) {

      return new URL(trimmed);
    }

  } catch (error) {

    console.warn(
      "URL parse error:",
      error
    );
  }


  /*
   * 文章の中にURLが含まれている場合
   */

  const match =
    input.match(
      /https?:\/\/[^\s]+/i
    );

  if (!match) {
    return null;
  }


  try {

    return new URL(
      match[0].replace(
        /[）)、。]+$/,
        ""
      )
    );

  } catch (error) {

    return null;
  }
}


/* =========================================================
   Google Maps URLを展開して座標取得
========================================================= */

async function extractCoordinatesFromUrl(
  targetUrl
) {

  /*
   * まずURL自身に座標が入っている場合
   */

  const direct =
    extractCoordinates(
      targetUrl.href
    );

  if (direct) {
    return direct;
  }


  /*
   * Google Maps短縮URL
   */

  const isShortGoogleUrl =
    /(^|\.)maps\.app\.goo\.gl$/i.test(
      targetUrl.hostname
    );


  /*
   * 使用するCORSプロキシ
   */

  const proxies = [

    {
      name: "allorigins",

      url:
        "https://api.allorigins.win/get?url=" +
        encodeURIComponent(
          targetUrl.href
        )
    },

    {
      name: "codetabs",

      url:
        "https://api.codetabs.com/v1/proxy?quest=" +
        encodeURIComponent(
          targetUrl.href
        )
    }
  ];


  let lastError = null;


  for (
    const proxy of proxies
  ) {

    try {

      statusBadge.innerText =
        `🌐 URL展開中...`;


      const response =
        await fetchWithTimeout(
          proxy.url,
          8000
        );


      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status}`
        );
      }


      let text = "";


      /*
       * allorigins
       */

      if (
        proxy.name === "allorigins"
      ) {

        const data =
          await response.json();

        /*
         * alloriginsのレスポンスに
         * リダイレクト後URLが存在する場合
         */

        if (data.url) {

          const finalUrlCoordinates =
            extractCoordinates(
              data.url
            );

          if (
            finalUrlCoordinates
          ) {

            return finalUrlCoordinates;
          }
        }

        text =
          data.contents || "";

      } else {

        text =
          await response.text();
      }


      /*
       * HTML / レスポンス全体から探す
       */

      let result =
        extractCoordinates(
          text
        );

      if (result) {
        return result;
      }


      /*
       * URLエンコード解除
       */

      try {

        const decoded =
          decodeURIComponent(
            text
          );

        result =
          extractCoordinates(
            decoded
          );

        if (result) {
          return result;
        }

      } catch (error) {
      }


      /*
       * HTML内にGoogle Maps URLが
       * 入っているケース
       */

      const googleUrls =
        text.match(
          /https?:\/\/(?:www\.)?google\.[^\s"'<>]+/gi
        );


      if (googleUrls) {

        for (
          const googleUrl of googleUrls
        ) {

          result =
            extractCoordinates(
              googleUrl
            );

          if (result) {
            return result;
          }
        }
      }


      /*
       * Google Mapsの座標らしき数値を探索
       *
       * 日本国内の座標に限定することで
       * HTML内の別の数値を誤認しにくくする
       */

      const coordinatePatterns = [

        /(-?\d{1,3}\.\d{5,}),(-?\d{1,3}\.\d{5,})/g,

        /(-?\d{1,3}\.\d{5,})%2C(-?\d{1,3}\.\d{5,})/gi,

        /(-?\d{1,3}\.\d{5,})%2[cC](-?\d{1,3}\.\d{5,})/g
      ];


      for (
        const pattern of coordinatePatterns
      ) {

        const matches =
          text.matchAll(
            pattern
          );


        for (
          const match of matches
        ) {

          const lat =
            parseFloat(
              match[1]
            );

          const lng =
            parseFloat(
              match[2]
            );


          if (
            validCoordinate(
              lat,
              lng
            ) &&
            lat >= 20 &&
            lat <= 46 &&
            lng >= 122 &&
            lng <= 154
          ) {

            return {
              lat: lat,
              lng: lng,
              source: "google-coordinate"
            };
          }
        }
      }

    } catch (error) {

      console.warn(
        `${proxy.name} failed:`,
        error
      );

      lastError =
        error;
    }
  }


  /*
   * 最後に元URLをもう一度解析
   */

  const fallback =
    extractCoordinates(
      targetUrl.href
    );

  if (fallback) {
    return fallback;
  }


  if (isShortGoogleUrl) {

    throw new Error(
      "Google Maps短縮URLを展開できませんでした"
    );
  }


  throw (
    lastError ||
    new Error(
      "座標を特定できませんでした"
    )
  );
}


/* =========================================================
   iPhone コンパス許可
========================================================= */

async function requestSensorPermission() {

  if (
    typeof DeviceOrientationEvent !==
    "undefined" &&

    typeof DeviceOrientationEvent.requestPermission ===
    "function"
  ) {

    const permission =
      await DeviceOrientationEvent
        .requestPermission();


    if (
      permission !== "granted"
    ) {

      throw new Error(
        "コンパスが許可されませんでした"
      );
    }
  }
}


/* =========================================================
   ナビ開始
========================================================= */

startBtn.addEventListener(
  "click",
  async () => {

    try {

      /*
       * iPhoneではユーザー操作中に
       * センサー許可を要求する
       */

      await requestSensorPermission();

    } catch (error) {

      console.error(
        error
      );

      alert(
        "コンパスの使用が許可されませんでした。"
      );

      return;
    }


    const inputVal =
      coordInput.value.trim();


    if (!inputVal) {

      coordInput.focus();

      return;
    }


    startBtn.disabled =
      true;

    errorHint.style.display =
      "none";

    statusBadge.innerText =
      "🔍 解析中...";


    try {

      /*
       * ==========================================
       * 1. 緯度,経度の直接入力
       * ==========================================
       */

      const direct =
        extractDirectCoordinates(
          inputVal
        );


      if (direct) {

        destLat =
          direct.lat;

        destLng =
          direct.lng;

        statusBadge.innerText =
          "📍 目的地設定済み";

        startSensors();

        return;
      }


      /*
       * ==========================================
       * 2. Google Maps URL
       * ==========================================
       */

      const url =
        extractURL(
          inputVal
        );


      if (!url) {

        throw new Error(
          "URLを認識できませんでした"
        );
      }


      statusBadge.innerText =
        "🌐 URLを展開しています...";


      const coords =
        await extractCoordinatesFromUrl(
          url
        );


      if (
        !coords ||
        !validCoordinate(
          coords.lat,
          coords.lng
        )
      ) {

        throw new Error(
          "有効な座標を取得できませんでした"
        );
      }


      destLat =
        coords.lat;

      destLng =
        coords.lng;


      console.log(
        "目的地座標:",
        destLat,
        destLng,
        "取得方法:",
        coords.source
      );


      statusBadge.innerText =
        "📍 目的地設定済み";


      startSensors();


    } catch (error) {

      console.error(
        "解析エラー:",
        error
      );

      statusBadge.innerText =
        "⚠️ URL解析エラー";

      errorHint.style.display =
        "block";

    } finally {

      startBtn.disabled =
        false;
    }
  }
);


/* =========================================================
   貼り付け時
========================================================= */

coordInput.addEventListener(
  "paste",
  () => {

    setTimeout(
      () => {

        if (
          coordInput.value.trim()
        ) {

          errorHint.style.display =
            "none";

          statusBadge.innerText =
            "📋 URLを受け取りました";
        }

      },
      50
    );
  }
);


/* =========================================================
   初期状態
========================================================= */

statusBadge.innerText =
  "🧭 待機中";

</script>

</body>
</html>
