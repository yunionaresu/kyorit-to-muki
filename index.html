<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Passenger Compass</title>
<style>
  :root {
    --bg-color: #f0edf4;
    --text-color: #333333;
    --shadow-light: #ffffff;
    --shadow-dark: #d5d1dd;
    --accent-green: #a4c639;
    --accent-orange: #f28500;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #1e1e1e;
      --text-color: #a0a0a0;
      --shadow-light: #2c2c2c;
      --shadow-dark: #101010;
    }
  }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .texture-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
  }

  .app-container {
    width: 350px;
    height: 650px;
    border-radius: 40px;
    padding: 30px 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    box-shadow: 12px 12px 24px var(--shadow-dark), 
                -12px -12px 24px var(--shadow-light);
    position: relative;
  }

  .status-badge {
    font-size: 13px;
    font-weight: bold;
    padding: 8px 16px;
    border-radius: 20px;
    box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                inset -3px -3px 6px var(--shadow-light);
    opacity: 0.8;
  }

  .compass-container {
    position: relative;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 12px 12px 24px var(--shadow-dark), 
                -12px -12px 24px var(--shadow-light);
  }

  .compass-inner {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: inset 8px 8px 16px var(--shadow-dark), 
                inset -8px -8px 16px var(--shadow-light);
  }

  .direction-arrow-container {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    z-index: 10;
  }

  .direction-arrow {
    position: absolute;
    top: -10px; 
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-bottom: 30px solid var(--accent-green);
    filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.2));
  }

  .distance-label {
    font-size: 16px;
    margin-bottom: 2px;
  }

  .distance-value {
    font-size: 42px;
    font-weight: 600;
    letter-spacing: 1px;
    text-align: center;
  }
  
  .unit {
    font-size: 18px;
    font-weight: normal;
  }

  .input-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 10px;
  }

  .coord-input {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 15px;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-size: 13px;
    box-sizing: border-box;
    box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                inset -4px -4px 8px var(--shadow-light);
    outline: none;
  }
  .coord-input::placeholder {
    color: #a0a0a0;
  }

  .btn {
    padding: 15px;
    border: none;
    border-radius: 15px;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 6px 6px 12px var(--shadow-dark), 
                -6px -6px 12px var(--shadow-light);
    transition: all 0.1s;
  }
  .btn:active {
    box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                inset -4px -4px 8px var(--shadow-light);
    color: var(--accent-orange);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .hint {
    font-size: 11px;
    color: #888;
    text-align: center;
    margin-top: -5px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="texture-overlay"></div>

<div class="app-container">
  <div class="status-badge" id="status">🧭 待機中</div>

  <div class="compass-container">
    <div class="direction-arrow-container" id="arrowContainer">
      <div class="direction-arrow"></div>
    </div>
    <div class="compass-inner">
      <div class="distance-label">残り</div>
      <div class="distance-value" id="distanceDisplay">--.<span class="unit">km</span></div>
    </div>
  </div>

  <div class="input-section">
    <input type="text" id="coordInput" class="coord-input" placeholder="Googleマップの共有URLをペースト">
    <button id="startBtn" class="btn">ナビ開始</button>
    <div class="hint" id="errorHint" style="display:none;">
      ※URL解析に失敗しました。<br>マップ上で建物のない道路を長押しして表示される<br>「35.xxx, 139.xxx」の数値を直接入力してください。
    </div>
  </div>
</div>

<script>
  const arrowContainer = document.getElementById('arrowContainer');
  const distanceDisplay = document.getElementById('distanceDisplay');
  const statusBadge = document.getElementById('status');
  const coordInput = document.getElementById('coordInput');
  const startBtn = document.getElementById('startBtn');
  const errorHint = document.getElementById('errorHint');

  let destLat = null, destLng = null;
  let currentLat = null, currentLng = null;
  let targetBearing = 0; 
  let deviceHeading = 0; 

  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }

  function calculateBearing(lat1, lon1, lat2, lon2) {
    const lat1Rad = lat1 * Math.PI / 180, lat2Rad = lat2 * Math.PI / 180;
    const lonDiff = (lon2 - lon1) * Math.PI / 180;
    const y = Math.sin(lonDiff) * Math.cos(lat2Rad);
    const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(lonDiff);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  function updateUI() {
    if (currentLat !== null && destLat !== null) {
      const distKm = calculateDistance(currentLat, currentLng, destLat, destLng);
      distanceDisplay.innerHTML = `${distKm.toFixed(1)}<span class="unit">km</span>`;
      targetBearing = calculateBearing(currentLat, currentLng, destLat, destLng);
    }
    arrowContainer.style.transform = `rotate(${targetBearing - deviceHeading}deg)`;
  }

  function handleOrientation(event) {
    if (event.webkitCompassHeading !== undefined) deviceHeading = event.webkitCompassHeading;
    else if (event.absolute === true && event.alpha !== null) deviceHeading = 360 - event.alpha;
    updateUI();
  }

  function startSensors() {
    statusBadge.innerText = "⚡️ センサー起動中...";
    errorHint.style.display = "none";
    if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    else window.addEventListener('deviceorientation', handleOrientation, true);

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (position) => {
          currentLat = position.coords.latitude;
          currentLng = position.coords.longitude;
          statusBadge.innerText = "🛰️ 案内中";
          updateUI();
        },
        (error) => { statusBadge.innerText = "⚠️ GPSエラー"; },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }
  }

  // タイムアウト付きのフェッチ関数（フリーズ防止）
  async function fetchWithTimeout(url, timeoutMs = 6000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);
    const response = await fetch(url, { signal: controller.signal });
    clearTimeout(id);
    return response;
  }

  // GoogleマップURLの展開・解析ロジック
  async function extractCoordinatesFromUrl(targetUrl) {
    // フリーズ回避のため、複数のプロキシサービスを順番に試行する
    const proxies = [
      `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
      `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
    ];

    for (let proxy of proxies) {
      try {
        const response = await fetchWithTimeout(proxy, 6000);
        let htmlStr = '';
        
        if (proxy.includes('allorigins')) {
          const data = await response.json();
          htmlStr = data.contents || '';
        } else {
          htmlStr = await response.text();
        }

        if (!htmlStr) continue;

        // 正規表現で座標らしきものを強力に探す（小数点3桁以上）
        const regexes = [
          /center=(-?\d+\.\d{3,})(?:%2C|,)(-?\d+\.\d{3,})/, // OGP画像用
          /@(-?\d+\.\d{3,}),(-?\d+\.\d{3,})/,               // リダイレクトURL用
          /ll=(-?\d+\.\d{3,})(?:%2C|,)(-?\d+\.\d{3,})/      // レガシーURL用
        ];

        for (let rx of regexes) {
          const match = htmlStr.match(rx);
          if (match) return { lat: parseFloat(match[1]), lng: parseFloat(match[2]) };
        }
      } catch (e) {
        console.warn("Proxy failed, trying next...", e);
      }
    }
    throw new Error("座標を特定できませんでした");
  }

  startBtn.addEventListener('click', async () => {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== 'granted') return alert('コンパスが許可されませんでした。');
      } catch (e) { console.error(e); }
    }

    const inputVal = coordInput.value;
    if (!inputVal) return;

    startBtn.disabled = true;
    errorHint.style.display = "none";
    statusBadge.innerText = "🔍 解析中...";

    try {
      // 1. まず「緯度, 経度」の直接入力かチェック
      const coordMatch = inputVal.match(/(-?\d+\.\d{3,})\s*,\s*(-?\d+\.\d{3,})/);
      if (coordMatch) {
        destLat = parseFloat(coordMatch[1]);
        destLng = parseFloat(coordMatch[2]);
        startSensors();
        startBtn.disabled = false;
        return;
      }

      // 2. GoogleマップURLが含まれているかチェック
      const urlMatch = inputVal.match(/https?:\/\/[^\s]+/);
      if (urlMatch) {
        statusBadge.innerText = "🌐 展開中...";
        const coords = await extractCoordinatesFromUrl(urlMatch[0]);
        destLat = coords.lat;
        destLng = coords.lng;
        startSensors();
        startBtn.disabled = false;
        return;
      }

      throw new Error("無効な入力です");

    } catch (error) {
      console.error(error);
      statusBadge.innerText = "⚠️ 解析エラー";
      errorHint.style.display = "block"; // 代替手段をユーザーに表示
      startBtn.disabled = false;
    }
  });
</script>
</body>
</html>
